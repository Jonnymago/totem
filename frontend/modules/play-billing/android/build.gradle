plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playbilling'
version = '1.0.0'

android {
  namespace 'expo.modules.playbilling'
  defaultConfig {
    minSdk 23
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Usiamo l'artefatto Java della stessa Play Billing Library 9.1.0: il progetto
  // Expo SDK 54 usa Kotlin 2.1, mentre l'artefatto KTX 9.1.0 richiede metadata 2.3.
  // Il modulo impiega le API callback, quindi non richiede estensioni KTX.
  implementation 'com.android.billingclient:billing:9.1.0'
}
