<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Vetrina TV — Totem</title>
  <style>
    :root {
      --bg: #000;
      --red: #E31C23;
      --yellow: #F5C400;
      --text: #fff;
      --muted: rgba(255,255,255,.7);
      --strip-h: 15vh;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 30; flex-direction: column; gap: 12px; }
    #boot.hide { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
    #queue-strip {
      height: var(--strip-h); min-height: 72px; max-height: 110px;
      background: #0a0a0a;
      border-bottom: 5px solid var(--red);
      display: flex; align-items: center; padding: 0 1.2rem; gap: 1.1rem; flex-shrink: 0;
    }
    #queue-strip.hidden { display: none; }
    body.queue-only #queue-strip { height: 100%; max-height: none; min-height: 100%; flex-direction: column; justify-content: center; border-bottom: 0; gap: 1.4rem; }
    body.queue-only #signage { display: none; }
    body.queue-only .now-num { font-size: clamp(7rem, 38vw, 20rem); }
    body.queue-only .now-lbl { font-size: 1.1rem; }
    body.queue-only .brand-name { font-size: 1.35rem; max-width: 80vw; }
    body.queue-only .next, body.queue-only .clock { display: none; }
    .brand-col { min-width: 0; }
    .brand-name { font-size: .8rem; font-weight: 900; letter-spacing: .12em; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; text-transform: uppercase; }
    .now-lbl { font-size: .62rem; font-weight: 800; letter-spacing: .2em; color: var(--red); }
    .now-num {
      font-size: clamp(2rem, 7.2vh, 4.1rem); font-weight: 900; font-variant-numeric: tabular-nums;
      line-height: .88; min-width: 2.1ch; text-align: center; text-shadow: 0 0 22px rgba(227,28,35,.5);
    }
    .now-num.pulse { animation: pulse .55s ease; }
    @keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
    .next { flex: 1; overflow: hidden; }
    .next-lbl { font-size: .58rem; font-weight: 800; letter-spacing: .14em; color: rgba(255,255,255,.4); margin-bottom: 4px; }
    .chips { display: flex; gap: .4rem; }
    .chip { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: .2rem .55rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .clock { font-weight: 900; color: var(--yellow); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
    #signage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; background: #000; }
    #cat-banner { padding: .45rem 1.1rem .1rem; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    #cat-name {
      display: inline-block; font-family: Impact, 'Arial Black', Arial, sans-serif;
      font-size: clamp(1.45rem, 3.8vw, 3rem); font-weight: 900;
      text-transform: uppercase; color: var(--red); letter-spacing: .03em;
      border-bottom: 6px solid var(--red); line-height: 1; padding-bottom: 3px;
    }
    #cat-name.swap { animation: titleIn .5s ease both; }
    @keyframes titleIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    #page-ind { color: rgba(255,255,255,.45); font-weight: 800; margin-bottom: .35rem; white-space: nowrap; }
    #board { flex: 1; min-height: 0; padding: .45rem .85rem .85rem; }
    #product-grid { height: 100%; display: grid; gap: 10px; }
    #product-grid.layout-2 { grid-template-columns: 1.2fr 1fr; }
    #product-grid.layout-3 { grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; }
    #product-grid.layout-4 { grid-template-columns: repeat(2, 1fr); }
    #product-grid.layout-6 { grid-template-columns: repeat(3, 1fr); }
    #product-grid.layout-8 { grid-template-columns: repeat(4, 1fr); }
    @media (orientation: portrait) {
      #product-grid.layout-6, #product-grid.layout-8 { grid-template-columns: repeat(2, 1fr); }
      #product-grid.layout-3 { grid-template-columns: 1fr; grid-template-rows: none; }
      .brand-name { max-width: 34vw; }
    }
    .card {
      position: relative; overflow: hidden; border-radius: 8px; background: #111; min-height: 0;
      display: flex; flex-direction: column; animation: cardIn .55s ease both;
    }
    .card:nth-child(1){animation-delay:.03s} .card:nth-child(2){animation-delay:.07s}
    .card:nth-child(3){animation-delay:.11s} .card:nth-child(4){animation-delay:.15s}
    .card:nth-child(5){animation-delay:.19s} .card:nth-child(6){animation-delay:.23s}
    .card:nth-child(7){animation-delay:.27s} .card:nth-child(8){animation-delay:.31s}
    @keyframes cardIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .card.hero { grid-row: span 2; }
    .card-img { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0a0a0a; }
    .card-img img {
      position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover;
      animation: ken 16s ease-in-out infinite alternate;
    }
    .card:nth-child(even) .card-img img { animation-duration: 18s; animation-delay: -4s; }
    .card:nth-child(3n) .card-img img { animation-duration: 20s; animation-delay: -8s; }
    @keyframes ken { from { transform: scale(1) translate3d(0,0,0); } to { transform: scale(1.12) translate3d(-2%,-1%,0); } }
    .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: #161616; }
    .card-caption {
      flex-shrink: 0; padding: .42rem .6rem .48rem; background: #000;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
    }
    .card:nth-child(odd) .card-caption { background: var(--yellow); }
    .card:nth-child(odd) .card-name { color: #111; }
    .card:nth-child(odd) .card-price { color: var(--red); }
    .card:nth-child(even) .card-name { color: #fff; }
    .card:nth-child(even) .card-price { color: var(--yellow); }
    .card-name { font-weight: 900; font-size: clamp(.82rem, 1.45vw, 1.2rem); text-transform: uppercase; line-height: 1.12; min-width: 0; }
    .card-price { font-family: Impact, 'Arial Black', Arial, sans-serif; font-size: clamp(1.05rem, 1.9vw, 1.65rem); white-space: nowrap; line-height: 1; }
    .card-tag { position: absolute; top: 8px; left: 8px; z-index: 2; background: var(--red); color: #fff; font-size: .62rem; font-weight: 800; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; }
    #empty { display: none; height: 100%; align-items: center; justify-content: center; color: var(--muted); }
    #progress { height: 4px; background: #222; flex-shrink: 0; }
    #progress > span { display: block; height: 100%; width: 0; background: var(--red); }
    #progress.run > span { animation: bar var(--rotate, 9s) linear; }
    @keyframes bar { from { width: 0; } to { width: 100%; } }
    #curtain {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: #000; z-index: 8; text-align: center;
    }
    #curtain.show { display: flex; animation: curtainIn .55s ease both; }
    @keyframes curtainIn { from { opacity: 0; } to { opacity: 1; } }
    #curtain-kicker { color: var(--yellow); letter-spacing: .28em; font-weight: 800; font-size: .8rem; margin-bottom: .5rem; }
    #curtain-cat { font-family: Impact, 'Arial Black', Arial, sans-serif; font-size: clamp(2rem, 7vw, 5rem); font-weight: 900; text-transform: uppercase; color: var(--red); border-bottom: 6px solid var(--red); display: inline-block; }
  </style>
</head>
<body>
  <div id="boot"><div class="brand-name">Caricamento vetrina…</div></div>
  <div id="app">
    <div id="queue-strip">
      <div class="brand-col">
        <div class="brand-name" id="restaurant-name">TOTEM</div>
        <div class="now-lbl">IN CHIAMATA</div>
      </div>
      <div class="now-num" id="current-number">—</div>
      <div class="next">
        <div class="next-lbl">PROSSIMI</div>
        <div class="chips" id="next-chips"></div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <main id="signage">
      <div id="cat-banner"><div id="cat-name">Menù</div><div id="page-ind"></div></div>
      <section id="board">
        <div id="product-grid" class="layout-6"></div>
        <div id="empty">Nessun prodotto da mostrare</div>
      </section>
      <div id="progress"><span></span></div>
      <div id="curtain"><div><div id="curtain-kicker">CATEGORIA</div><div id="curtain-cat"></div></div></div>
    </main>
  </div>
  <script>
(function () {
  var params = new URLSearchParams(location.search);
  var path = (location.pathname || '').replace(/\/+$/, '');
  var MODE = (params.get('mode') || '').toLowerCase();
  if (path.slice(-6) === '/queue' || MODE === 'queue') MODE = 'queue';
  else if (MODE !== 'products') MODE = 'full';
  var ROTATE_MS = parseInt(params.get('rotate') || params.get('interval') || '9000', 10);
  if (ROTATE_MS < 120) ROTATE_MS *= 1000;
  var screenId = params.get('screen') || '';
  var categoryIds = (params.get('categories') || params.get('categoryId') || '').split(',').filter(Boolean);
  var forcedCols = parseInt(params.get('cols') || '0', 10);
  document.documentElement.style.setProperty('--rotate', (ROTATE_MS / 1000) + 's');
  if (MODE === 'products') document.getElementById('queue-strip').classList.add('hidden');
  if (MODE === 'queue') document.body.classList.add('queue-only');

  var categories = [], products = [], screens = [], pages = [];
  var pageIndex = 0, currentCalling = null, started = false, pageBusy = false;
  var rotateTimer = null, audioCtx = null;

  function fetchJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'\u0026amp;').replace(/</g,'\u0026lt;').replace(/>/g,'\u0026gt;').replace(/"/g,'\u0026quot;');
  }
  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function playCallChime() {
    unlockAudio();
    try {
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      [[220, 0, 0.22, 'square', 0.55], [880, 0.08, 0.28, 'triangle', 0.9], [1174.7, 0.28, 0.32, 'triangle', 0.95], [1318.5, 0.52, 0.4, 'sine', 1]].forEach(function (t) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = t[3];
        osc.frequency.setValueAtTime(t[0], now + t[1]);
        gain.gain.setValueAtTime(0.0001, now + t[1]);
        gain.gain.exponentialRampToValueAtTime(t[4], now + t[1] + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t[1] + t[2]);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + t[1]); osc.stop(now + t[1] + t[2] + 0.02);
      });
    } catch (e) {}
  }
  function photoSrc(p) {
    return '/api/signage-photo/' + encodeURIComponent(p.id);
  }
  function rebuildPages() {
    var cats = categories.slice().sort(function (a, b) { return (a.order_index || 0) - (b.order_index || 0); });
    if (categoryIds.length) cats = cats.filter(function (c) { return categoryIds.indexOf(String(c.id)) >= 0; });
    pages = [];
    cats.forEach(function (cat) {
      var list = products.filter(function (p) { return String(p.category_id) === String(cat.id); });
      for (var i = 0; i < list.length; i += 8) {
        pages.push({ id: cat.id, name: cat.name || 'Menù', products: list.slice(i, i + 8) });
      }
    });
    if (pageIndex >= pages.length) pageIndex = 0;
  }
  function renderQueue(withPulse) {
    if (MODE === 'products') return;
    var el = document.getElementById('current-number');
    var nextText = currentCalling != null ? pad(currentCalling) : '—';
    if (withPulse && el.textContent !== nextText) {
      el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
      playCallChime();
    }
    el.textContent = nextText;
  }
  function layoutFor(n) {
    if (forcedCols === 2) return 'layout-2';
    if (forcedCols === 3) return n <= 3 ? 'layout-3' : 'layout-6';
    if (forcedCols === 4) return n <= 4 ? 'layout-4' : 'layout-8';
    if (forcedCols === 6) return 'layout-6';
    if (n <= 2) return 'layout-2';
    if (n === 3) return 'layout-3';
    if (n <= 4) return 'layout-4';
    if (n <= 6) return 'layout-6';
    return 'layout-8';
  }
  function buildCards(page) {
    var list = page.products.slice(0, 8);
    return list.map(function (p, idx) {
      var hero = (list.length === 3 && idx === 0) || (list.length <= 2 && idx === 0) ? ' hero' : '';
      var tag = p.is_featured ? '<div class="card-tag">IN EVIDENZA</div>' : '';
      var img = '<img src="' + escapeHtml(photoSrc(p)) + '" alt="" onerror="this.onerror=null;this.style.display=\'none\';this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<div class=ph>\\uD83C\\uDF7D\\uFE0F</div>\');" />';
      return '<article class="card' + hero + '">' + tag + '<div class="card-img">' + img + '</div><div class="card-caption">' +
        '<div class="card-name">' + escapeHtml(p.name || '') + '</div>' +
        '<div class="card-price">\u20AC' + Number(p.price || 0).toFixed(2) + '</div></div></article>';
    }).join('');
  }
  function renderPage(animate) {
    if (MODE === 'queue') return;
    var grid = document.getElementById('product-grid');
    var empty = document.getElementById('empty');
    var catName = document.getElementById('cat-name');
    var pageInd = document.getElementById('page-ind');
    if (!pages.length) {
      grid.style.display = 'none'; empty.style.display = 'flex'; catName.textContent = 'Menù'; pageInd.textContent = '';
      return;
    }
    empty.style.display = 'none'; grid.style.display = 'grid';
    var page = pages[pageIndex % pages.length];
    var apply = function () {
      catName.textContent = page.name;
      if (animate) { catName.classList.remove('swap'); void catName.offsetWidth; catName.classList.add('swap'); }
      pageInd.textContent = pages.length > 1 ? ((pageIndex % pages.length) + 1) + ' / ' + pages.length : '';
      grid.className = layoutFor(page.products.length);
      grid.innerHTML = buildCards(page);
      var bar = document.getElementById('progress');
      bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
    };
    if (!animate || pageBusy) { apply(); return; }
    pageBusy = true;
    var curtain = document.getElementById('curtain');
    document.getElementById('curtain-cat').textContent = page.name;
    curtain.classList.add('show');
    setTimeout(function () {
      apply();
      setTimeout(function () { curtain.classList.remove('show'); pageBusy = false; }, 420);
    }, 520);
  }
  function startTimers() {
    if (rotateTimer) clearInterval(rotateTimer);
    if (MODE === 'queue') return;
    if (pages.length > 1) {
      rotateTimer = setInterval(function () {
        pageIndex = (pageIndex + 1) % pages.length;
        renderPage(true);
      }, ROTATE_MS);
    }
  }
  function applyCatalog(catalog, isRefresh) {
    if (!catalog) return;
    if (catalog.restaurant_name) document.getElementById('restaurant-name').textContent = String(catalog.restaurant_name).toUpperCase();
    if (catalog.accent_color) document.documentElement.style.setProperty('--red', catalog.accent_color);
    categories = catalog.categories || [];
    products = catalog.products || [];
    screens = catalog.screens || [];
    if (screenId) {
      var sc = screens.filter(function (s) { return String(s.id) === String(screenId); })[0];
      if (sc) {
        if (sc.mode === 'products') {
          MODE = 'products';
          document.getElementById('queue-strip').classList.add('hidden');
        }
        if ((sc.category_ids || []).length) categoryIds = sc.category_ids.map(String);
      }
    }
    rebuildPages();
    renderPage(false);
    document.getElementById('boot').classList.add('hide');
    if (!isRefresh) startTimers();
  }
  function pollCalling() {
    fetchJson('/api/display-queue/calling').then(function (data) {
      if (!data) return;
      var n = data.number == null ? null : Number(data.number);
      if (n !== currentCalling) {
        currentCalling = n;
        renderQueue(true);
      }
    });
  }
  function tickClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      pageIndex = (pageIndex + 1) % Math.max(pages.length, 1);
      renderPage(true);
    }
  });
  fetchJson('/api/signage-catalog').then(function (catalog) {
    if (catalog && catalog.products) applyCatalog(catalog, false);
    else {
      Promise.all([fetchJson('/api/settings'), fetchJson('/api/categories'), fetchJson('/api/products')]).then(function (arr) {
        var settings = arr[0] || {};
        applyCatalog({
          restaurant_name: settings.restaurant_name,
          categories: arr[1] || [],
          products: (arr[2] || []).map(function (p) {
            return { id: p.id, name: p.name, price: p.price, category_id: p.category_id, is_featured: p.is_featured, has_image: !!p.image, description: p.description || '' };
          }),
          screens: settings.signage_screens || []
        }, false);
      });
    }
  });
  setInterval(function () { fetchJson('/api/signage-catalog').then(function (c) { applyCatalog(c, true); }); }, 20000);
  setInterval(pollCalling, 2000);
  setInterval(tickClock, 1000);
  tickClock();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
})();
  </script>
</body>
</html>
