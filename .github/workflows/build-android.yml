name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Modalità di compilazione APK"
        required: true
        default: "eas-cloud"
        type: choice
        options:
          - "eas-cloud"
          - "github-actions-native"
      profile:
        description: "Profilo EAS (solo per eas-cloud)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - master

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-eas:
    name: EAS Cloud Build (Android APK)
    if: ${{ github.event.inputs.build_mode == 'eas-cloud' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || '5RxLW27QU9J-k68FwKaA84LQ6H9o2Cu2gvuAA9-r' }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || '5RxLW27QU9J-k68FwKaA84LQ6H9o2Cu2gvuAA9-r' }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Compilazione su EAS Cloud con profilo: $PROFILE..."
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

      - name: EAS Build Info
        run: |
          echo "✅ Build Android APK avviata con successo su EAS!"
          echo "🔗 Monitora l'avanzamento su: https://expo.dev/accounts/mamafo2236s-team/projects/mamafo2236/builds"

  build-native:
    name: GitHub Actions Native Gradle APK Build
    if: ${{ github.event.inputs.build_mode == 'github-actions-native' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate and copy APK
        run: |
          mkdir -p ../dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} ../dist-apk/Totem-QuickBite-v1.1.9.apk \;
          ls -la ../dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Totem-QuickBite-Android-APK
          path: dist-apk/Totem-QuickBite-v1.1.9.apk
          retention-days: 14
