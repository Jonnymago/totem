name: Build Android APK (EAS Cloud & GitHub Actions)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      profile:
        description: "Profilo EAS Build"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      wait_for_completion:
        description: "Attendi completamento build su expo.dev"
        required: true
        default: "true"
        type: boolean

concurrency:
  group: eas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-eas:
    name: EAS Cloud Build (expo.dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate kiosk api.impl
        shell: bash
        run: |
          SIZE=$(wc -c < src/api/api.impl.ts)
          echo "api.impl.ts size=$SIZE"
          if [ "$SIZE" -lt 15000 ]; then
            echo "api.impl.ts is truncated ($SIZE bytes). Need the full local DB implementation."
            exit 1
          fi
          grep -q "export async function ensureLocalDbLoaded" src/api/api.impl.ts
          grep -q "export const adminLogin" src/api/api.impl.ts
          grep -q "export const createProduct" src/api/api.impl.ts
          echo "api.impl.ts validation OK"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild embedded Remote Admin
        run: node scripts/bundle-web.js

      - name: Validate Remote Admin bundle
        shell: bash
        run: |
          node <<'NODE'
          const b = require('./src/utils/web_build.json');
          const paths = ['/remote/index.html', '/remote.html', '/admin/index.html', '/admin.html'];
          for (const path of paths) {
            if (!b[path]?.data?.includes('Pannello Gestione Totem')) {
              throw new Error(`Missing Remote Admin bundle: ${path}`);
            }
            if (b[path]?.data?.includes("let token = 'local-admin-token'")) {
              throw new Error(`Fake-token login still in bundle: ${path}`);
            }
          }
          console.log('Remote Admin bundle validation OK');
          NODE

      - name: Start Build on EAS Cloud (expo.dev)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          WAIT="${{ github.event.inputs.wait_for_completion || 'true' }}"
          
          echo "Avvio compilazione Android su EAS Cloud (expo.dev) - Profilo: $PROFILE..."
          
          if [ "$WAIT" = "false" ]; then
            eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
          else
            eas build --platform android --profile "$PROFILE" --non-interactive
          fi

      - name: EAS Build Complete Summary
        run: |
          echo "### 📱 Build inviata ed eseguita su expo.dev!" >> $GITHUB_STEP_SUMMARY
          echo "- **Account Expo**: \`cejohoy727s-team\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Progetto**: \`totem\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard EAS**: [expo.dev/accounts/cejohoy727s-team/projects/totem/builds](https://expo.dev/accounts/cejohoy727s-team/projects/totem/builds)" >> $GITHUB_STEP_SUMMARY
