name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      profile:
        description: Profilo EAS Build
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

      wait_for_completion:
        description: Attendi il completamento della build EAS
        required: true
        default: false
        type: boolean

concurrency:
  group: eas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-eas:
    name: Avvia build Android su Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug context senza secret
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Verifica EXPO_TOKEN
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || 'LzpqoxDEc07l4qK5Qb4oxI8yIQnefAUfiGUqWuul' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Manca il secret EXPO_TOKEN nelle Actions secrets di GitHub"
            exit 1
          fi
          echo "EXPO_TOKEN presente"

      - name: Verifica configurazione Expo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const expo = config.expo || {};
          const projectId = expo.extra?.eas?.projectId;

          if (expo.owner !== 'cogoy23817s-teamq') {
            throw new Error(`Owner Expo non valido: ${expo.owner}`);
          }

          if (expo.newArchEnabled !== true) {
            throw new Error('newArchEnabled deve essere true');
          }

          if (projectId !== '570f77d9-89c5-4ded-a6d0-e4281f08e2ef') {
            throw new Error(`Project ID non valido: ${projectId}`);
          }

          console.log('Configurazione Expo valida');
          NODE

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || 'LzpqoxDEc07l4qK5Qb4oxI8yIQnefAUfiGUqWuul' }}

      - name: Installazione dipendenze
        run: npm ci || npm install --legacy-peer-deps

      - name: Generazione asset
        run: node scripts/generate-assets.js

      - name: Ricostruzione Remote Admin
        run: node scripts/bundle-web.js

      - name: Verifica Remote Admin bundle
        shell: bash
        run: |
          node <<'NODE'
          const b = require('./src/utils/web_build.json');
          const paths = [
            '/remote/index.html',
            '/remote.html',
            '/admin/index.html',
            '/admin.html'
          ];

          for (const path of paths) {
            if (!b[path]?.data?.includes('Pannello Gestione Totem')) {
              throw new Error(`Remote Admin bundle mancante: ${path}`);
            }
          }

          console.log('Remote Admin bundle valido');
          NODE

      - name: Avvia build Android su Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || 'LzpqoxDEc07l4qK5Qb4oxI8yIQnefAUfiGUqWuul' }}
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          WAIT="${{ github.event.inputs.wait_for_completion || 'false' }}"

          echo "Avvio build Android su Expo EAS"
          echo "Profilo: $PROFILE"
          echo "Attesa completamento: $WAIT"

          if [ "$WAIT" = "true" ]; then
            eas build \
              --platform android \
              --profile "$PROFILE" \
              --non-interactive
          else
            eas build \
              --platform android \
              --profile "$PROFILE" \
              --non-interactive \
              --no-wait
          fi

      - name: Summary finale
        if: always()
        run: |
          echo "### Build Android EAS" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`Jonnymago/totem\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Account Expo: \`cogoy23817s-teamq\`" >> $GITHUB_STEP_SUMMARY
          echo "- Progetto: \`totem\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard EAS: https://expo.dev/accounts/cogoy23817s-teamq/projects/totem/builds" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions: https://github.com/Jonnymago/totem/actions" >> $GITHUB_STEP_SUMMARY
          echo "- La modalità predefinita usa \`--no-wait\` per non consumare minuti durante la build cloud." >> $GITHUB_STEP_SUMMARY

