name: Build Android APK (EAS Cloud & GitHub Actions)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      profile:
        description: "Profilo EAS Build"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]
      wait_for_completion:
        description: "Attendi completamento build su expo.dev"
        required: true
        default: true
        type: boolean

concurrency:
  group: eas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-eas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Debug context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Validate EXPO_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret"
            exit 1
          fi

      - name: Validate Expo config
        shell: bash
        run: |
          grep -q '"newArchEnabled": true' app.json || (echo 'newArchEnabled must be true' && exit 1)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Rebuild embedded Remote Admin
        run: node scripts/bundle-web.js

      - name: Validate Remote Admin bundle
        shell: bash
        run: |
          node <<'NODE'
          const b = require('./src/utils/web_build.json');
          const paths = ['/remote/index.html', '/remote.html', '/admin/index.html', '/admin.html'];
          for (const path of paths) {
            if (!b[path]?.data?.includes('Pannello Gestione Totem')) throw new Error(`Missing Remote Admin bundle: ${path}`);
          }
          console.log('Remote Admin bundle validation OK');
          NODE

      - name: Start Build on EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          WAIT="${{ github.event.inputs.wait_for_completion || 'true' }}"
          if [ "$WAIT" = "false" ]; then
            eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
          else
            eas build --platform android --profile "$PROFILE" --non-interactive
          fi

      - name: Summary
        run: |
          echo "### 📱 Build Android EAS Cloud" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Actions Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Expo Dashboard**: https://expo.dev/accounts/cejohoy727s-team/projects/totem/builds" >> $GITHUB_STEP_SUMMARY

