name: Fix login HTML fallback
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          b = Path('scripts/fix_login.b64').read_text().strip()
          Path('scripts/fix_login_html_route.py').write_bytes(gzip.decompress(base64.b64decode(b)))
          PY
          python3 scripts/fix_login_html_route.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/utils/LocalServer.ts frontend/app.json public frontend/public frontend/backend/static/remote/index.html backend/static/remote/index.html scripts/fix_login_html_route.py || true
          if git diff --cached --quiet; then echo no changes; else git commit -m "fix: login API must never return HTML" && git push; fi
