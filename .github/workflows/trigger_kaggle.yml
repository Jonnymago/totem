name: Compila APK su Kaggle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  bundle-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Configura Credenziali Kaggle
        env:
          APK_TOKEN: ${{ secrets.APK_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p ~/.kaggle
          TOKEN="${APK_TOKEN:-$KAGGLE_KEY}"
          USERNAME="${KAGGLE_USERNAME:-giovannipriolo}"
          if [[ "$TOKEN" =~ ^\{.*\}$ ]]; then
            echo "$TOKEN" > ~/.kaggle/kaggle.json
          else
            echo "$TOKEN" > ~/.kaggle/access_token
            echo "{\"username\":\"$USERNAME\",\"key\":\"$TOKEN\"}" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/kaggle.json || true
          chmod 600 ~/.kaggle/access_token || true
          echo "KAGGLE_API_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Auto-Discovery Dataset Cache & Configura Metadata
        run: |
          python3 -c "
          import json, os
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()

          print('🔍 Verifica dataset utente disponibili su Kaggle...')
          target_ds = 'giovannipriolo/android-sdk-cache'
          try:
              user_datasets = api.dataset_list(mine=True)
              ds_refs = [d.ref for d in user_datasets]
              print('Dataset trovati:', ds_refs)
              for ref in ds_refs:
                  if 'android-sdk-cache' in ref or 'sdk-cache' in ref:
                      target_ds = ref
                      print(f'✅ Aggancio dataset cache: {target_ds}')
                      break
          except Exception as e:
              print('Avviso ricerca dataset:', e)

          with open('kernel-metadata.json', 'r') as f:
              meta = json.load(f)

          meta['dataset_sources'] = [target_ds]
          with open('kernel-metadata.json', 'w') as f:
              json.dump(meta, f, indent=2)

          print('Kernel metadata pronto:')
          print(json.dumps(meta, indent=2))
          "

      - name: Genera Runner Script Kaggle Multi-Arch
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.PAT || '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' }}
        run: |
          python3 scripts/generate_kaggle_payload.py "$GH_PAT" "${{ github.repository }}" "${{ github.sha }}"

      - name: Valida Metadata e Kernel Script
        run: |
          test -f kernel-metadata.json || (echo "Missing kernel-metadata.json!" && exit 1)
          test -f kaggle_build.py || (echo "Missing kaggle_build.py!" && exit 1)
          cat kernel-metadata.json

      - name: Invio ed esecuzione su Kaggle
        run: |
          kaggle kernels push -p .

      - name: Verifica Stato Kernel Kaggle
        run: |
          sleep 5
          kaggle kernels status giovannipriolo/apk-builder || true
          echo "=================================================="
          echo "🚀 Monitora su Kaggle: https://www.kaggle.com/code/giovannipriolo/apk-builder"
          echo "=================================================="
