name: Trigger Kaggle APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  kaggle_build:
    name: Package and Push to Kaggle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Configure Kaggle Credentials
        env:
          APK_TOKEN: ${{ secrets.APK_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          if [[ "$APK_TOKEN" =~ ^\{.*\}$ ]]; then
            echo "$APK_TOKEN" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "$APK_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
            echo "{\"username\":\"giovannipriolo\",\"key\":\"$APK_TOKEN\"}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi
          echo "KAGGLE_API_TOKEN=$APK_TOKEN" >> $GITHUB_ENV

      - name: Generate Kaggle Builder Script & Payload
        run: |
          python3 scripts/generate_kaggle_payload.py

      - name: Validate Metadata and Kernel Script
        run: |
          test -f kernel-metadata.json || (echo "Missing kernel-metadata.json!" && exit 1)
          test -f kaggle_build.py || (echo "Missing kaggle_build.py!" && exit 1)
          cat kernel-metadata.json

      - name: Push Kernel to Kaggle (with Diagnostic Logging)
        run: |
          python3 -c "
          import os, sys, json, requests
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()

          print('Checking existing kernels...')
          try:
              my_kernels = api.kernels_list(mine=True)
              print('My kernels:', [k.ref for k in my_kernels])
          except Exception as e:
              print('Could not list kernels:', e)

          with open('kernel-metadata.json', 'r') as f:
              meta = json.load(f)
          print('Pushing metadata:', json.dumps(meta, indent=2))

          try:
              api.kernels_push(folder='.')
              print('🎉 Kernel pushed successfully to Kaggle!')
          except requests.exceptions.HTTPError as e:
              print(f'❌ Kaggle API HTTPError ({e.response.status_code}):')
              print(f'API Response Body: {e.response.text}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Kaggle Push Error: {e}')
              if hasattr(e, 'response') and hasattr(e.response, 'text'):
                  print(f'API Response Body: {e.response.text}')
              sys.exit(1)
          "

      - name: Check Kaggle Kernel Status
        run: |
          sleep 5
          kaggle kernels status giovannipriolo/apk-builder || true
          echo "=================================================="
          echo "🚀 Monitor on Kaggle: https://www.kaggle.com/code/giovannipriolo/apk-builder"
          echo "=================================================="
