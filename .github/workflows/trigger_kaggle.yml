name: Compila APK su Kaggle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  bundle-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Configura Credenziali Kaggle
        env:
          APK_TOKEN: ${{ secrets.APK_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p ~/.kaggle
          TOKEN="${APK_TOKEN:-$KAGGLE_KEY}"
          USERNAME="${KAGGLE_USERNAME:-giovannipriolo}"
          if [[ "$TOKEN" =~ ^\{.*\}$ ]]; then
            echo "$TOKEN" > ~/.kaggle/kaggle.json
          else
            echo "$TOKEN" > ~/.kaggle/access_token
            echo "{\"username\":\"$USERNAME\",\"key\":\"$TOKEN\"}" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/kaggle.json || true
          chmod 600 ~/.kaggle/access_token || true
          echo "KAGGLE_API_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Genera Runner Script Kaggle Multi-Arch
        run: |
          python3 scripts/generate_kaggle_payload.py "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "${{ github.sha }}"

      - name: Valida Metadata e Kernel Script
        run: |
          test -f kernel-metadata.json || (echo "Missing kernel-metadata.json!" && exit 1)
          test -f kaggle_build.py || (echo "Missing kaggle_build.py!" && exit 1)
          cat kernel-metadata.json

      - name: Invio ed esecuzione su Kaggle
        run: |
          kaggle kernels push -p .

      - name: Verifica Stato Kernel Kaggle
        run: |
          sleep 5
          kaggle kernels status giovannipriolo/apk-builder || true
          echo "=================================================="
          echo "🚀 Monitora su Kaggle: https://www.kaggle.com/code/giovannipriolo/apk-builder"
          echo "=================================================="
