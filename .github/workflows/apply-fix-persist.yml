name: Apply persist / remote-admin fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source files
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          b64 = pathlib.Path('scripts/apply_persist_patch.py.gz.b64').read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('/tmp/apply_persist_patch.py').write_bytes(data)
          PY
          python3 /tmp/apply_persist_patch.py
      - name: Commit
        run: |
          git config user.name "Totem Bot"
          git config user.email "bot@totem.local"
          git add frontend public backend/static/remote/index.html
          git diff --cached --stat
          git commit -m "fix: persistenza stampanti/IP, pagina bianca remote admin, scan Bluetooth" || echo "no changes"
          git push
