name: Apply persist / remote-admin fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync admin HTML and rebuild web_build
        run: |
          python3 scripts/fix_white_page.py
          node frontend/scripts/bundle-web.js
      - name: Commit
        run: |
          git config user.name "Totem Bot"
          git config user.email "bot@totem.local"
          git add public backend/static frontend/public frontend/backend/static \
            frontend/src/utils/LocalServer.ts frontend/scripts/bundle-web.js \
            frontend/src/utils/web_build.json frontend/app.json scripts/fix_white_page.py
          git diff --cached --stat
          git commit -m "fix: pagina bianca admin remoto, sync HTML, v1.2.4" || echo "no changes"
          git push
