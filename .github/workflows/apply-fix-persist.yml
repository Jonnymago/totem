name: Apply persist / remote-admin fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch source files
        run: |
          python3 scripts/fix_white_page.py || true
          python3 scripts/fix_login_api.py
          node frontend/scripts/bundle-web.js
      - name: Commit
        run: |
          git config user.name "Totem Bot"
          git config user.email "bot@totem.local"
          git add frontend public backend/static scripts
          git diff --cached --stat
          git commit -m "fix: remote login same local PIN/user, API never returns HTML" || echo "no changes"
          git push
