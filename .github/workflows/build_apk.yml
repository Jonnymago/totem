name: Build Totem Android APK (GitHub Actions)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Esegui build pulita (ignora cache Gradle temporaneamente)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: 📥 Scarica Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 20 & Cache NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: ☕ Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle con Cache Attiva
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: 📱 Accetta Licenze Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: 📦 Installa Dipendenze Frontend
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generazione Progetto Nativo Android)
        working-directory: frontend
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔧 Configura Debug Signing per APK Standalone
        working-directory: frontend/android
        run: |
          python3 -c "
          import os
          gradle_file = 'app/build.gradle'
          if os.path.exists(gradle_file):
              with open(gradle_file, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'signingConfig signingConfigs.debug' not in content:
                  content = content.replace(
                      'buildTypes {',
                      'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }'
                  )
                  with open(gradle_file, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('✅ Configurato signingConfigs.debug per release in build.gradle!')
              else:
                  print('ℹ️ signingConfig già configurato.')
          "

      - name: 🔨 Compilazione Gradle APK Standalone (assembleRelease)
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --max-workers=2 \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g"

      - name: 📦 Raccogli e Valida APK Generato
        id: collect-apk
        run: |
          mkdir -p dist-apk
          
          # Cerca l'APK Release/Debug generato da Gradle
          FOUND_APK=$(find frontend/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
          
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "❌ Errore critico: Nessun APK trovato nella directory di build!"
            exit 1
          fi
          
          echo "✅ APK trovato con successo: $FOUND_APK"
          FILE_SIZE=$(du -h "$FOUND_APK" | cut -f1)
          echo "📊 Dimensione APK: $FILE_SIZE"
          
          # Copia con nomi standard e chiari
          cp "$FOUND_APK" "dist-apk/Totem-QuickBite-Universal.apk"
          cp "$FOUND_APK" "dist-apk/app-release.apk"
          
          # Generazione checksum SHA-256
          cd dist-apk
          sha256sum *.apk > checksums.sha256
          cd ..
          
          echo "=================================================="
          echo "🎉 File generati pronti per il download:"
          ls -lh dist-apk/
          echo "=================================================="

      - name: 📤 Carica Artefatti APK su GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Totem-QuickBite-Android-APK
          path: dist-apk/
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Pubblica Release con Download Diretto APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Totem QuickBite Standalone APK (Latest Build)"
          body: |
            ### 📱 Totem QuickBite - Android Standalone APK
            Compilazione automatica generata da GitHub Actions con bundle JS offline Hermes.

            - **Download Diretto APK:** Clicca sul file `Totem-QuickBite-Universal.apk` allegato qui sotto nella sezione Assets per scaricare e installare direttamente sul tablet.
            - **Commit:** `${{ github.sha }}`
          files: |
            dist-apk/Totem-QuickBite-Universal.apk
            dist-apk/checksums.sha256
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

