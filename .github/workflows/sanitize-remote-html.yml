name: Sanitize remote admin HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitize-remote-html.yml"
      - "scripts/sanitize_remote_html.py"

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize HTML
        run: python3 scripts/sanitize_remote_html.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/remote/index.html public/remote/index.html public/remote.html || true
          if git diff --cached --quiet; then
            echo already clean
          else
            git commit -m "fix: require real PIN login in remote admin HTML"
            git push
          fi
