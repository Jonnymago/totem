name: Sanitize remote admin HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitize-remote-html.yml"
      - "scripts/sanitize_remote_html.py"
      - "public/admin.html"
      - "public/admin/index.html"
      - "public/remote.html"
      - "public/remote/index.html"
      - "backend/static/remote/index.html"

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize HTML
        run: python3 scripts/sanitize_remote_html.py
      - name: Fail if fake-token bypass remains
        run: |
          if grep -R --include='*.html' -n "let token = 'local-admin-token'" backend/static/remote public; then
            echo "Fake-token login bypass still present"
            exit 1
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/remote/index.html public/remote/index.html public/remote.html public/admin.html public/admin/index.html || true
          if git diff --cached --quiet; then
            echo already clean
          else
            git commit -m "fix: require real PIN login in remote admin HTML"
            git push
          fi
