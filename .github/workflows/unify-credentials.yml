name: Unify local/remote credentials
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply credential alignment
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          raw = Path('scripts/unify_creds.b64').read_text().strip()
          Path('scripts/unify_local_remote_creds.py').write_bytes(gzip.decompress(base64.b64decode(raw)))
          print('decoded', Path('scripts/unify_local_remote_creds.py').stat().st_size)
          PY
          python3 scripts/unify_local_remote_creds.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts frontend/src/api/api.impl.ts frontend/src/utils/LocalServer.ts frontend/app.json public frontend/public frontend/backend/static/remote/index.html backend/static/remote/index.html || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "fix: same admin user/password/PIN for local and remote panel"
            git push
          fi
