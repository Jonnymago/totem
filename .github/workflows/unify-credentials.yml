name: Unify local/remote credentials
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply credential alignment
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          b = Path('/home/workdir/artifacts/script.b64').read_text() if False else '''REPLACE'''
          print(len(b))
          PY
