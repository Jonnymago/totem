name: Unify local/remote credentials
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply credential alignment
        run: python3 scripts/unify_local_remote_creds.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/unify_local_remote_creds.py \
            frontend/src/api/api.impl.ts \
            frontend/src/utils/LocalServer.ts \
            frontend/app.json \
            public/admin.html public/remote.html public/admin/index.html public/remote/index.html \
            frontend/public/admin.html frontend/public/remote.html \
            frontend/public/admin/index.html frontend/public/remote/index.html \
            frontend/backend/static/remote/index.html \
            backend/static/remote/index.html || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "fix: same admin user/password/PIN for local and remote panel"
            git push
          fi
