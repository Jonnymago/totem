name: Remote Admin EAS Test

on:
  push:
    branches:
      - fix/remote-admin-stability

jobs:
  build-eas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Remote Admin bundle
        run: node scripts/bundle-web.js
      - name: Validate Remote Admin bundle
        run: node -e "const b=require('./src/utils/web_build.json'); for(const k of ['/remote/index.html','/remote.html','/admin/index.html','/admin.html']) if(!b[k]?.data?.includes('Pannello Gestione Totem')) throw new Error('Missing Remote Admin bundle: '+k); console.log('Remote Admin bundle OK')"
      - name: Start EAS Android APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
