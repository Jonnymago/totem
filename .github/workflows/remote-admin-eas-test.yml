name: Remote Admin EAS Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-eas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Remote Admin bundle
        run: node scripts/bundle-web.js

      - name: Validate Remote Admin bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const b = require('./src/utils/web_build.json');
          const paths = ['/remote/index.html', '/remote.html', '/admin/index.html', '/admin.html'];
          for (const path of paths) {
            if (!b[path]?.data?.includes('Pannello Gestione Totem')) {
              throw new Error(`Missing Remote Admin bundle: ${path}`);
            }
          }
          console.log('Remote Admin bundle OK');
          NODE

      - name: Start EAS Android APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
